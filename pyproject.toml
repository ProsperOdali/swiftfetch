[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "swiftfetch"
version = "0.1.0"
description = "Download PDF files from an uploadserver."
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "requests",
    "beautifulsoup4"
]

[project.scripts]
swiftfetch = "swiftfetch.downloader:cli"